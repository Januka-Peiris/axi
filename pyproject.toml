[project]
name = "axi-monorepo"
version = "0.1.0"
description = "AXI Semantic Layer - Complete Installation"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "BSL-1.1"}

# This is a metapackage for development convenience
# The actual packages are installed via the Makefile

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Metapackage with no code - packages installed separately
only-include = []
