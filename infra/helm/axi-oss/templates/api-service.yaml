{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "axi-oss.fullname" . }}-api
  labels:
    {{- include "axi-oss.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "axi-oss.api.selectorLabels" . | nindent 4 }}
{{- end }}
