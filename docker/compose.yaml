version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: axi
      POSTGRES_USER: axi
      POSTGRES_PASSWORD: axi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../examples/demo:/app/demo
    environment:
      - AXI_METADATA_DIR=/app/demo
      # Set AXI_STORAGE=postgres to opt into Postgres; SQLite remains default.
      # - AXI_STORAGE=postgres
      # - DATABASE_URL=postgres://axi:axi_dev_password@postgres:5432/axi
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
