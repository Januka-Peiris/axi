version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../examples/demo:/app/demo
    environment:
      - AXI_METADATA_DIR=/app/demo

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
