version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: axi
      POSTGRES_USER: axi
      POSTGRES_PASSWORD: axi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../examples/demo:/app/demo
    environment:
      - AXI_METADATA_DIR=/app/demo
      # Uncomment to use PostgreSQL instead of SQLite:
      # - AXI_DB_TYPE=postgres
      # - AXI_DB_HOST=postgres
      # - AXI_DB_PORT=5432
      # - AXI_DB_NAME=axi
      # - AXI_DB_USER=axi
      # - AXI_DB_PASSWORD=axi_dev_password
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
