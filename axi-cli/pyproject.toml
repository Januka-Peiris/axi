[project]
name = "axi-cli"
version = "0.1.0"
description = "AXI: Command Line Interface"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Jay"}]
dependencies = [
  "typer",
  "rich",
  "axi-semantic",
]

[project.scripts]
axi = "axi_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axi_cli"]
