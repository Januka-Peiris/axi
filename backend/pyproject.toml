[project]
name = "axi-semantic"
version = "0.1.0"
description = "AXI: Open Source Semantic Layer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSL-1.1"}
authors = [{name="Jay"}]
dependencies = [
  "sqlglot>=20.0",
  "fastapi>=0.115",
  "uvicorn",
  "pydantic",
  "pydantic-settings",
  "python-dotenv",
  "click",
  "sqlalchemy",
  "alembic",
  "networkx",
  "rich",
  "snowflake-connector-python",
  "pyyaml",
  "typer",
  "psycopg2-binary"
]

[project.scripts]
axi-api = "axi.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axi"]
